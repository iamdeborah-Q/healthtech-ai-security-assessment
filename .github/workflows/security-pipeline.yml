name: AI Security Assessment Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

# STAGE 1 — Check for accidentally committed passwords or API keys
  secret-scanning:
    name: Stage 1 - Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Download code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: HEAD~1
          head: HEAD
        continue-on-error: true


# STAGE 2 — Scan source code for security bugs without running the app
  static-analysis:
    name: Stage 2 - Static Code Analysis
    runs-on: ubuntu-latest
    needs: secret-scanning
    steps:
      - name: Download code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install analysis tools
        run: pip install bandit semgrep

      - name: Run Bandit - finds Python security bugs
        run: |
          bandit -r . \
            --exclude ./venv,./tests \
            -f json \
            -o bandit-results.json \
            -ll || true

      - name: Run Semgrep - finds OWASP Top 10 violations
        run: |
          semgrep \
            --config=p/python \
            --config=p/security-audit \
            --json \
            --output semgrep-results.json \
            . || true

      - name: Save scan results
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-results
          path: |
            bandit-results.json
            semgrep-results.json


# STAGE 3 — Check Python packages for known CVEs
  dependency-scan:
    name: Stage 3 - Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    needs: secret-scanning
    steps:
      - name: Download code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Scan dependencies for CVEs
        run: |
          pip install -r requirements.txt
          pip-audit \
            --format json \
            --output pip-audit-results.json || true

      - name: Save dependency scan results
        uses: actions/upload-artifact@v4
        with:
          name: dependency-scan-results
          path: pip-audit-results.json


# STAGE 4 — Run all 59 security tests against live DiagnosticAssist
  security-tests:
    name: Stage 4 - Security Tests
    runs-on: ubuntu-latest
    needs: [ static-analysis, dependency-scan ]
    steps:
      - name: Download code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install DiagnosticAssist dependencies
        run: |
          pip install fastapi uvicorn pydantic \
            requests numpy python-dotenv httpx \
            python-multipart

      - name: Start DiagnosticAssist app
        run: |
          cd diagnosticassist
          uvicorn app:app --host 0.0.0.0 --port 8000 &
          echo "Waiting for DiagnosticAssist to be ready..."
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health; then
              echo "App is ready after $i attempts"
              exit 0
            fi
            echo "Attempt $i: not ready yet, waiting 3s..."
            sleep 3
          done
          echo "ERROR: App failed to start after 45 seconds"
          exit 1

      - name: Install security test tools
        run: |
          pip install pytest requests \
            adversarial-robustness-toolbox numpy

      - name: Run authentication tests
        run: |
          mkdir -p results
          pytest tests/unit/test_authentication.py \
            -v --junitxml=results/auth-results.xml
        continue-on-error: true

      - name: Run prompt injection tests
        run: |
          pytest tests/unit/test_prompt_injection.py \
            -v --junitxml=results/injection-results.xml
        continue-on-error: true

      - name: Run EHR isolation tests
        run: |
          pytest tests/integration/test_ehr_isolation.py \
            -v --junitxml=results/ehr-results.xml
        continue-on-error: true

      - name: Run adversarial robustness tests
        run: |
          pytest tests/adversarial/test_adversarial_images.py \
            -v --junitxml=results/adversarial-results.xml
        continue-on-error: true

      - name: Save test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: results/


# STAGE 5 — Evaluate results and approve or block deployment
  security-gate:
    name: Stage 5 - Security Gate
    runs-on: ubuntu-latest
    needs: security-tests
    steps:
      - name: Download code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: results/

      - name: Evaluate security gate thresholds
        run: |
          python3 << 'PYTHON'
          import sys
          import glob

          print("=" * 50)
          print("SECURITY GATE EVALUATION")
          print("=" * 50)

          result_files = glob.glob("results/*.xml")
          total_passed = 0
          total_failed = 0

          for file in result_files:
              with open(file) as f:
                  content = f.read()
                  passed = content.count('testcase') - \
                           content.count('failure') - \
                           content.count('error')
                  failed = content.count('failure') + \
                           content.count('error')
                  total_passed += passed
                  total_failed += failed
                  print(f"{file}: {passed} passed {failed} failed")

          print(f"\nTotal: {total_passed} passed {total_failed} failed")
          print("=" * 50)

          if total_failed > 15:
              print("HARD BLOCK: Too many failures")
              print("Deployment blocked")
              sys.exit(1)
          else:
              print("SECURITY GATE: PASSED")
              print("Deployment approved")
              sys.exit(0)
          PYTHON


# STAGE 6 — Write a summary to the GitHub Actions dashboard
  deployment-summary:
    name: Stage 6 - Deployment Summary
    runs-on: ubuntu-latest
    needs: security-gate
    if: always()
    steps:
      - name: Write summary to GitHub dashboard
        run: |
          echo "## Security Assessment Pipeline" \
            >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scanning | Done |" >> $GITHUB_STEP_SUMMARY
          echo "| Static Analysis | Done |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Scan | Done |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Tests  | Done |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Gate   | Done |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Platform: HealthTech AI DiagnosticAssist" \
            >> $GITHUB_STEP_SUMMARY
